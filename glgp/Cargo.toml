[package]
name = "glgp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json", "query", "native-tls"] }
[target.'cfg(unix)'.dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
regex = "1.12.4"
