[package]
name = "glgp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
regex = "1.12.4"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
[target.'cfg(unix)'.dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json", "query"] }
