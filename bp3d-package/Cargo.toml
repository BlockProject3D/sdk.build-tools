[package]
name = "bp3d-package"
description = "BP3D Package is a tool used to package libraries and applications in OS native formats."
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
toml = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
copy_dir = "0.1.3"
bp3d-util = { version = "2.2.0", features = ["result"] }
bp3d-build = { path = "../bp3d-build" }
bp3d-lua = { version = "1.0.0-rc.5.0.0", path = "../../tools.lua/core", features = ["root-vm", "libs", "dynamic", "send"] }
