[package]
name = "fpkg"
version = "0.1.0"
edition = "2024"
description = "A minimalistic package generator/installer tool"
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
bp3d-util = { version = "2.2.0", features = ["path", "result", "simple-error"] }
toml = "1.1.2+spec-1.1.0"
bpx = { version = "4.0.0-rc.13.3.1", features = ["package"] }
bp3d-debug = "1.0.3"
current_platform = "0.2.0"
glgp = { path = "../glgp" }
regex = "1.12.4"
bp3d-os = { version = "2.3.3", features = ["assets", "dirs"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
[target.'cfg(unix)'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
