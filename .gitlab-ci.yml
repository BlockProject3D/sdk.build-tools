include:
    - project: bp3d/gitlab-tools
      file: workflows/base-jobs.yml

stages:
    - test
    - deploy

.base-unix-test-job:
    stage: test
    script:
        - startsection setup "Cloning tools.lua..."
        - cd ..
        - git clone --recursive https://gitlab.com/bp3d/lua.git tools.lua
        - cd -
        - endsection setup
        - startsection build "Building..."
        - cargo build
        - endsection build
        - startsection gen "Generating distinstall package..."
        - ./target/debug/bp3d package -p distinstall
        - endsection gen
    artifacts:
        paths:
            - target/install-*

.base-win64-test-job:
    stage: test
    script:
        - startsection setup "Cloning tools.lua..."
        - pushd .
        - cd ..
        - git clone --recursive https://gitlab.com/bp3d/lua.git tools.lua
        - popd
        - endsection setup
        - startsection build "Building..."
        - cargo build
        - endsection build
        - startsection gen "Generating distinstall package..."
        - ./target/debug/bp3d package -p distinstall
        - endsection gen
    artifacts:
        paths:
            - target/install-*

linux-test:
    extends:
        - .unix-base-job
        - .base-unix-test-job

windows-test:
    extends:
        - .win64-base-job
        - .base-win64-test-job

macos-test:
    extends:
        - .mac-base-job
        - .base-unix-test-job

.base-unix-deploy-job:
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    variables:
        FPKG_PARAM_TOKEN: $CI_JOB_TOKEN
    stage: deploy
    script:
        - startsection setup "Cloning tools.lua..."
        - cd ..
        - git clone --recursive https://gitlab.com/bp3d/lua.git tools.lua
        - cd -
        - endsection setup
        - startsection build "Building..."
        - cargo build
        - endsection build
        - startsection gen "Publishing package..."
        - ./target/debug/bp3d package -p pubdist
        - endsection gen

.base-win64-deploy-job:
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    variables:
        FPKG_PARAM_TOKEN: $CI_JOB_TOKEN
    stage: deploy
    script:
        - startsection setup "Cloning tools.lua..."
        - pushd .
        - cd ..
        - git clone --recursive https://gitlab.com/bp3d/lua.git tools.lua
        - popd
        - endsection setup
        - startsection build "Building..."
        - cargo build
        - endsection build
        - startsection gen "Publishing package..."
        - ./target/debug/bp3d package -p pubdist
        - endsection gen

linux-deploy:
    rules:
        - if: $CI_COMMIT_TAG
    extends:
        - .unix-base-job
        - .base-unix-deploy-job

windows-deploy:
    extends:
        - .win64-base-job
        - .base-win64-deploy-job

macos-deploy:
    extends:
        - .mac-base-job
        - .base-unix-deploy-job
