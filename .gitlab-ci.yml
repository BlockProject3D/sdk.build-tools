stages:
    - test

linux-test:
    image: rust:trixie
    stage: test
    script:
        - echo "Cloning tools.lua..."
        - cd ..
        - git clone https://gitlab.com/bp3d/lua.git tools.lua
        - cd -
        - echo "Building..."
        - cargo build
        - echo "Generating distinstall package..."
        - ./target/debug/bp3d package -p distinstall
        - fpkg publish -p token=$CI_JOB_TOKEN

windows-test:
    tags:
        - saas-windows-medium-amd64
    stage: test
    script:
        - echo "Setting up rust/cargo..."
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s
        - echo "Cloning tools.lua..."
        - cd ..
        - git clone https://gitlab.com/bp3d/lua.git tools.lua
        - cd -
        - echo "Building..."
        - cargo build
        - echo "Generating distinstall package..."
        - ./target/debug/bp3d package -p distinstall
        - fpkg publish -p token=$CI_JOB_TOKEN
